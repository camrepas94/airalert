<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="AirAlert">
  <!-- Full-bleed space background (see public/brand-icon-bg.svg) -->
  <image
    href="/brand-icon-bg.svg"
    xlink:href="/brand-icon-bg.svg"
    width="1024"
    height="1024"
    x="0"
    y="0"
    preserveAspectRatio="xMidYMid meet"
  />
  <!-- TV mark from logo.png — centered square slot (~82% of canvas; `meet` keeps aspect ratio) -->
  <g transform="translate(512 512)">
    <image
      href="/brand-tv-from-logo.png"
      xlink:href="/brand-tv-from-logo.png"
      x="-420"
      y="-420"
      width="840"
      height="840"
      preserveAspectRatio="xMidYMid meet"
    />
  </g>
</svg>
